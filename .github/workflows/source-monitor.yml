name: public-source-monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * 0'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m compute_monitor.monitor
      - uses: actions/upload-artifact@v4
        with:
          name: public-source-review-report
          path: reports/source-check.json
