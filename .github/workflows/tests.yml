name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python -m pytest -q
      - run: compute-monitor --database data/monitor.duckdb
      - run: python -m compute_monitor.release
      - run: python scripts/export_html.py
      - run: docker build -t compute-monitor .
      - run: docker run --rm compute-monitor python -c "from compute_monitor.model import build_database; c=build_database(); assert c.execute('SELECT count(*) FROM daily_demand').fetchone()[0] == 11"
